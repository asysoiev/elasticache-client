## Example of redis standalone setup
## To run all services, execute the command:
# docker-compose -f redis-standalone-dc.yml up -d
services:
  redis:
    image: redis:8.0.2
    container_name: redis-standalone
    environment:
      redis-server:
      save: 60 1
      loglevel: warning
    ports:
      - "6379:6379"
    networks:
      - redis-standalone

networks:
  redis-standalone:
    driver: bridge